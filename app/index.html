<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>French Study App</title>
  <script>
    // Apply the saved theme before first paint (shared with the course site: same key)
    (function () {
      var t = "auto";
      try { t = localStorage.getItem("llc.theme") || "auto"; } catch (e) {}
      if (t !== "auto") document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <!-- ?v= forces phones to fetch all files fresh after an update: bump it whenever app files change -->
  <link rel="stylesheet" href="style.css?v=2026-10-19.2">
</head>
<body>
  <header class="topbar">
    <h1>🇫🇷 French Study</h1>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Theme. Click to change.">🌓 Auto</button>
    <nav id="tabs" role="tablist">
      <button data-tab="today" class="active">Today</button>
      <button data-tab="cards"><span class="long">Flashcards</span><span class="short">Cards</span></button>
      <button data-tab="conj"><span class="long">Conjugation</span><span class="short">Verbs</span></button>
      <button data-tab="gender">Gender</button>
      <button data-tab="numbers">Numbers</button>
      <button data-tab="songs"><span class="long">Song Workshop</span><span class="short">Songs</span></button>
      <button data-tab="tutor">💬 Tutor</button>
    </nav>
  </header>

  <main>
    <section id="tab-today" class="tab active"></section>
    <section id="tab-cards" class="tab"></section>
    <section id="tab-conj" class="tab"></section>
    <section id="tab-gender" class="tab"></section>
    <section id="tab-numbers" class="tab"></section>
    <section id="tab-songs" class="tab"></section>
    <section id="tab-tutor" class="tab"></section>
  </main>

  <div id="accent-bar" class="accent-bar" aria-label="Accent keyboard">
    <span>Accents:</span>
  </div>

  <footer class="foot">
    Progress is saved in this browser only. Use <b>Today → Backup</b> to export it.
    · Lyrics you paste stay local; never commit them to the repo.
  </footer>

  <script src="data/vocab.js?v=2026-10-19.2"></script>
  <script src="data/verbs.js?v=2026-10-19.2"></script>
  <script src="app.js?v=2026-10-19.2"></script>
</body>
</html>
