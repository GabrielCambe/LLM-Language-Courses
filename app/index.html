<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>French Study App</title>
  <script>
    // Apply the saved theme before first paint (shared with the course site: same key)
    (function () {
      var t = "auto";
      try { t = localStorage.getItem("llc.theme") || "auto"; } catch (e) {}
      if (t !== "auto") document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <!-- ?v= forces phones to fetch all files fresh after an update: bump it whenever app files change -->
  <link rel="stylesheet" href="style.css?v=2026-10-25.2">
</head>
<body>
  <header class="topbar">
    <!-- Course and language pickers have static options so they still show with a stale cached app.js -->
    <h1><select id="course-select" class="course-select" aria-label="Course">
      <option value="fr">🇫🇷 French</option>
      <option value="es">🇪🇸 Spanish</option>
      <option value="la">🏛️ Latin</option>
      <option value="pl">🇵🇱 Polish</option>
      <option value="ja">🇯🇵 Japanese</option>
    </select></h1>
    <div class="top-controls">
      <select id="lang-select" class="lang-select" aria-label="Interface language">
        <option value="en">🌐 English</option>
        <option value="pt-BR">🌐 Português</option>
      </select>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Theme. Click to change.">🌓 Auto</button>
    </div>
    <nav id="tabs" role="tablist">
      <button data-tab="today" class="active" data-i18n="tab.today">Today</button>
      <button data-tab="cards"><span class="long" data-i18n="tab.cards">Flashcards</span><span class="short" data-i18n="tab.cardsShort">Cards</span></button>
      <button data-tab="conj"><span class="long" data-i18n="tab.conj">Conjugation</span><span class="short" data-i18n="tab.conjShort">Verbs</span></button>
      <button data-tab="gender" data-i18n="tab.gender">Gender</button>
      <button data-tab="numbers" data-i18n="tab.numbers">Numbers</button>
      <button data-tab="songs"><span class="long" data-i18n="tab.songs">Song Workshop</span><span class="short" data-i18n="tab.songsShort">Songs</span></button>
      <button data-tab="tutor" data-i18n="tab.tutor">💬 Tutor</button>
    </nav>
  </header>

  <main>
    <section id="tab-today" class="tab active"></section>
    <section id="tab-cards" class="tab"></section>
    <section id="tab-conj" class="tab"></section>
    <section id="tab-gender" class="tab"></section>
    <section id="tab-numbers" class="tab"></section>
    <section id="tab-songs" class="tab"></section>
    <section id="tab-tutor" class="tab"></section>
  </main>

  <div id="accent-bar" class="accent-bar" aria-label="Accent keyboard">
    <span data-i18n="accents">Accents:</span>
  </div>

  <footer class="foot" data-i18n-html="footer">
    Progress is saved in this browser only. Use <b>Today → Backup</b> to export it.
    · Lyrics you paste stay local; never commit them to the repo.
  </footer>

  <script src="data/vocab.js?v=2026-10-25.2"></script>
  <script src="data/verbs.js?v=2026-10-25.2"></script>
  <script src="data/spanish.js?v=2026-10-25.2"></script>
  <script src="data/latin.js?v=2026-10-25.2"></script>
  <script src="data/polish.js?v=2026-10-25.2"></script>
  <script src="data/japanese.js?v=2026-10-25.2"></script>
  <script src="data/courses.js?v=2026-10-25.2"></script>
  <script src="i18n.js?v=2026-10-25.2"></script>
  <script src="app.js?v=2026-10-25.2"></script>
</body>
</html>
